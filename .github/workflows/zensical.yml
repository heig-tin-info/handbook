name: zensical

# The Zensical chain, next to the MkDocs one and blocking nothing: it builds
# the site with Zensical and the two books with TeXSmith 0.8 from PyPI, and
# uploads both as artefacts. `ci.yml` keeps publishing the site with MkDocs
# until this job is green on its own.

on:
  push:
    branches:
      - master
      - main
      - zensical
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zensical-${{ github.ref }}
  cancel-in-progress: true


jobs:
  zensical:
    name: Build the Zensical site and the two books
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout the handbook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant ghostscript

      - name: Install Python deps with uv
        run: uv sync

      # `texsmith site assets` exports the 123 draw.io diagrams of the corpus
      # to SVG, and its first backend is Playwright. Without the exports the
      # pages point at `.drawio` files no browser renders, so the browser is
      # worth its minute.
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: Build the site and the two books
        run: make zensical

      - name: Upload the site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zensical-site
          path: site/
          if-no-files-found: warn

      - name: Upload the books
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zensical-pdf
          path: |
            build/book/book.pdf
            build/tools/tools.pdf
          if-no-files-found: warn
