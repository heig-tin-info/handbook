name: ci

# The site is built with Zensical and the two books with TeXSmith, in one job
# (`make all`). A push to the main branch publishes the site on `gh-pages`,
# replacing whatever was there: the latest publication is the only one, there
# are no versions to go back to. A tag also attaches the two books, compressed
# for print, to a GitHub release. A pull request builds without publishing.

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site and the two books
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the handbook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant ghostscript

      - name: Install Python deps with uv
        run: uv sync

      # `texsmith site assets` exports the draw.io diagrams of the corpus to
      # SVG, and its first backend is Playwright. Without the exports the
      # pages point at `.drawio` files no browser renders.
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: Build the site and the two books
        run: make all

      - name: Compress the books for print
        run: make optimize

      - name: Publish the site on gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload the books
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: |
            build/book/book-print.pdf
            build/tools/tools-print.pdf
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the books
        uses: actions/download-artifact@v4
        with:
          name: PDF
          path: ./build

      - name: Rename the books
        run: |
          mv ./build/book/book-print.pdf ./build/handbook.pdf
          mv ./build/tools/tools-print.pdf ./build/devtools.pdf

      - name: Create release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ./build/handbook.pdf
            ./build/devtools.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
